resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    root /var/www/public;

    index index.php;

    charset utf-8;

    # Proxy interno: las imágenes de medios viven físicamente en el admin.
    # El público las sirve bajo su propio dominio sin exponer el dominio
    # del admin en el HTML final, y sin duplicar los archivos.
    location /storage/ {
        set $media_upstream integral_nginx_admin;
        proxy_pass http://$media_upstream:80;
        proxy_set_header Host integralbackend.webinfo.sv;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        set $upstream_php app:9000;
        fastcgi_pass $upstream_php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.ht {
        deny all;
    }
}